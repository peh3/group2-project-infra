name: Terraform CI 
run-name: Running Terraform CI by ${{ github.actor }}

on:
  pull_request:
    paths:
      - 'terraform/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write         # For short-lived OIDC token generation
  contents: read          # Read repo source
  pull-requests: write    # Post plan diff comments back to the PR

jobs:
  # =========================================================================
  # 1. INFRASTRUCTURE LINT & SNYK SECURITY GATES
  # =========================================================================
  infra-security-and-lint:
    name: "Infra Security Gates: Lint, Secret Scan & Snyk IaC"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # Gate 1: Secret Leak Prevention
      # -------------------------------------------------------------
      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # Gate 2: Code Formatting
      # -------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      # -------------------------------------------------------------
      # Gate 3: Snyk IaC Misconfiguration Scan
      # -------------------------------------------------------------
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk IaC Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # --severity-threshold=high ensures hard exit on HIGH and CRITICAL issues
        # Fails the pipeline with non-zero exit code on violations
        run: |
          snyk iac test ./terraform \
            --severity-threshold=high \
            --scan=resource-changes

  # =========================================================================
  # 2. SPECULATIVE TERRAFORM PLAN (STAGING & PRODUCTION)
  # =========================================================================
  infra-speculative-plan:
    name: "Speculative Terraform Plan: Staging & Prod"
    needs: infra-security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # -------------------------------------------------------------
      # Plan Staging
      # -------------------------------------------------------------
      - name: Configure AWS Credentials (Staging Read/Plan Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Terraform Init & Plan (Staging)
        id: plan_staging
        working-directory: ./terraform
        run: |
          terraform init -reconfigure -backend-config=envs/staging.backend.hcl
          terraform plan -no-color -var-file=envs/staging.tfvars -out=tfplan_staging > plan_staging.txt

      # -------------------------------------------------------------
      # Plan Production (Read-only review artifact)
      # -------------------------------------------------------------
      - name: Configure AWS Credentials (Production Read/Plan Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Terraform Init & Plan (Production)
        id: plan_prod
        working-directory: ./terraform
        run: |
          terraform init -reconfigure -backend-config=envs/production.backend.hcl
          terraform plan -no-color -var-file=envs/production.tfvars -out=tfplan_prod > plan_prod.txt

      # -------------------------------------------------------------
      # Post Plan Output to PR Conversation
      # -------------------------------------------------------------
      - name: Post Plan Summary to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            const stagingPlan = fs.readFileSync('terraform/plan_staging.txt', 'utf8');
            const prodPlan = fs.readFileSync('terraform/plan_prod.txt', 'utf8');
            
            const trimOutput = (str) => str.length > 50000 ? str.substring(str.length - 50000) : str;

            const body = `### 📋 Speculative Infrastructure Plan Results (Snyk Verified)

            #### 🧪 Staging Plan
            \`\`\`hcl
            ${trimOutput(stagingPlan)}
            \`\`\`

            #### 🚀 Production Plan
            \`\`\`hcl
            ${trimOutput(prodPlan)}
            \`\`\`

            *Commit: \`${context.sha}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });