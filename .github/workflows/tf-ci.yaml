name: Terraform CI 
run-name: Running Terraform CI by ${{ github.actor }}

on:
  pull_request:
    paths:
      - 'terraform/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write         # For short-lived OIDC token generation
  contents: read          # Read repo source
  pull-requests: write    # Post plan diff comments back to the PR

jobs:
  # =========================================================================
  # 1. INFRASTRUCTURE LINT & SNYK SECURITY GATES
  # =========================================================================
  infra-security-and-lint:
    name: "Infra Security Gates: Lint, Secret Scan & Snyk IaC"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks to inspect the full PR commit range

      # -------------------------------------------------------------
      # Gate 1: Secret Leak Prevention
      # -------------------------------------------------------------
      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}

      # -------------------------------------------------------------
      # Gate 2: Code Formatting
      # -------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      # -------------------------------------------------------------
      # Gate 3: Snyk IaC Misconfiguration Scan
      # -------------------------------------------------------------
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk IaC Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk iac test ./terraform \
            --severity-threshold=high \
            --scan=resource-changes

  # =========================================================================
  # 2. SPECULATIVE PLAN: STAGING
  # =========================================================================
  plan-staging:
    name: "Speculative Terraform Plan: Staging"
    needs: infra-security-and-lint
    runs-on: ubuntu-latest
    environment: staging    # Resolves AWS_ROLE_ARN from 'staging' environment
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Configure AWS Credentials (Staging Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify Directory Layout
        run: |
          pwd
          ls -la terraform/
          ls -la terraform/envs/ || ls -la envs/

      - name: Terraform Init & Plan (Staging)
        working-directory: ./terraform
        run: |
          terraform init -reconfigure -backend-config=envs/staging.backend.hcl
          terraform plan -no-color -var-file=envs/staging.tfvars -out=tfplan_staging > plan_staging.txt

      - name: Upload Staging Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-staging-output
          path: terraform/plan_staging.txt

  # =========================================================================
  # 3. SPECULATIVE PLAN: PRODUCTION
  # =========================================================================
  plan-production:
    name: "Speculative Terraform Plan: Production"
    needs: infra-security-and-lint
    runs-on: ubuntu-latest
    environment: production # Resolves AWS_ROLE_ARN from 'production' environment
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Configure AWS Credentials (Production Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init & Plan (Production)
        working-directory: ./terraform
        run: |
          terraform init -reconfigure -backend-config=envs/production.backend.hcl
          terraform plan -no-color -var-file=envs/production.tfvars -out=tfplan_prod > plan_prod.txt

      - name: Upload Production Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-prod-output
          path: terraform/plan_prod.txt

  # =========================================================================
  # 4. POST PLAN SUMMARY TO PR COMMENT
  # =========================================================================
  post-pr-comment:
    name: "Post Plan Summary to PR"
    needs: [plan-staging, plan-production]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download Staging Plan
        uses: actions/download-artifact@v4
        with:
          name: plan-staging-output
          path: ./

      - name: Download Production Plan
        uses: actions/download-artifact@v4
        with:
          name: plan-prod-output
          path: ./

      - name: Post Plan Summary to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.APP_ACCESS_TOKEN }}
          script: |
            const fs = require('fs');
            
            const stagingPlan = fs.readFileSync('plan_staging.txt', 'utf8');
            const prodPlan = fs.readFileSync('plan_prod.txt', 'utf8');
            
            const trimOutput = (str) => str.length > 50000 ? str.substring(str.length - 50000) : str;

            const body = `### 📋 Speculative Infrastructure Plan Results (Snyk Verified)

            #### 🧪 Staging Plan
            \`\`\`hcl
            ${trimOutput(stagingPlan)}
            \`\`\`

            #### 🚀 Production Plan
            \`\`\`hcl
            ${trimOutput(prodPlan)}
            \`\`\`

            *Commit: \`${context.sha}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });