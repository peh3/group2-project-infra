name: Terraform CD
run-name: Running Terraform CD by ${{ github.actor }}

on:
  push:
    paths:
      - 'terraform/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Assume Staging Role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Apply Staging
        working-directory: ./terraform
        run: |
          terraform init -reconfigure -backend-config=envs/staging.backend.hcl
          terraform apply -var-file=envs/staging.tfvars -auto-approve

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # Protected environment requiring manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Assume Production Role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Apply Production
        working-directory: ./terraform
        run: |
          terraform init -reconfigure -backend-config=envs/production.backend.hcl
          terraform apply -var-file=envs/production.tfvars -auto-approve